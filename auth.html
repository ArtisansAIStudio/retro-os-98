<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Signing in - Basement 98</title>
<style>body{font:16px Tahoma,Arial,sans-serif;background:#008080;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}</style>
</head><body><p id="m">Signing you in...</p>
<script>
(function(){
  var m=document.getElementById('m');
  try{
    var h=new URLSearchParams(location.hash.slice(1)), at=h.get('access_token'), rt=h.get('refresh_token');
    if(!at||!rt){ m.textContent='Sign-in was not completed. You can close this window.'; return; }
    var p=JSON.parse(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    var exp=parseInt(h.get('expires_at'),10)||p.exp;
    localStorage.setItem('auth98',JSON.stringify({access_token:at,refresh_token:rt,expires_at:exp,email:p.email||'',name:(p.user_metadata&&(p.user_metadata.full_name||p.user_metadata.name))||''}));
    history.replaceState(null,'',location.pathname);
    m.textContent='Signed in. Closing...'; setTimeout(function(){ window.close(); },300);
  }catch(e){ m.textContent='Something went wrong. You can close this window and try again.'; }
})();
</script></body></html>
